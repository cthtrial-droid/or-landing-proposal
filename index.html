<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>정형외과 랜딩 기구·위탁 임플란트 관리 개선(안) 의견 수렴</title>
<style>
  :root{--primary:#0B2545;--primary-soft:#13315C;--accent:#BE9B30;--bg:#F4F6FA;
        --surface:#FFFFFF;--text:#1F2937;--text-soft:#64748B;--border:#E2E8F0;--negative:#B91C1C;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',sans-serif;
       background:linear-gradient(150deg,#0B2545 0%,#13315C 55%,#1B4068 100%);
       color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:420px;background:var(--surface);border-radius:14px;
        box-shadow:0 24px 60px rgba(3,17,38,.38);overflow:hidden}
  .card-head{padding:30px 32px 22px;border-bottom:1px solid var(--border)}
  .mark{width:34px;height:3px;background:var(--accent);border-radius:2px;margin-bottom:16px}
  h1{font-size:17px;font-weight:700;color:var(--primary);letter-spacing:-.2px;line-height:1.45}
  .sub{margin-top:8px;font-size:12.5px;color:var(--text-soft);line-height:1.6}
  .card-body{padding:24px 32px 30px}
  label{display:block;font-size:12px;font-weight:600;color:var(--text-soft);margin-bottom:8px}
  input[type=password]{width:100%;padding:12px 14px;font-size:15px;border:1px solid var(--border);
        border-radius:8px;background:#FBFCFE;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
  input[type=password]:focus{border-color:var(--primary-soft);box-shadow:0 0 0 3px rgba(19,49,92,.10)}
  button{width:100%;margin-top:16px;padding:12px 14px;font-size:14px;font-weight:600;color:#fff;
        background:var(--primary);border:0;border-radius:8px;cursor:pointer;transition:background .15s}
  button:hover{background:var(--primary-soft)}
  button:disabled{background:#94A3B8;cursor:progress}
  .err{margin-top:12px;font-size:12.5px;color:var(--negative);min-height:18px;line-height:1.5}
  .foot{margin-top:20px;padding-top:16px;border-top:1px solid var(--border);
        font-size:11px;color:var(--text-soft);line-height:1.65}
  noscript{display:block;margin-top:12px;font-size:12.5px;color:var(--negative)}
</style>
</head>
<body>
<div class="card">
  <div class="card-head">
    <div class="mark"></div>
    <h1>정형외과 랜딩 기구·위탁 임플란트 관리 개선(안) 의견 수렴</h1>
    <p class="sub">본 자료는 내부 관리용 자료입니다. 열람 암호를 입력해 주십시오.</p>
  </div>
  <div class="card-body">
    <form id="f" autocomplete="off">
      <label for="pw">열람 암호</label>
      <input type="password" id="pw" autocomplete="current-password" autofocus>
      <button type="submit" id="btn">열람하기</button>
      <p class="err" id="err"></p>
    </form>
    <noscript>이 자료를 열람하려면 JavaScript를 허용해 주십시오.</noscript>
    <p class="foot">문서 내용은 AES-256-GCM으로 암호화되어 있으며, 올바른 암호 없이는 복호화되지 않습니다.<br>대외 유출 및 무단 배포를 금합니다.</p>
  </div>
</div>

<script>
(function(){
  var P = JSON.parse(document.getElementById('payload').textContent);
  var f = document.getElementById('f'), pw = document.getElementById('pw'),
      btn = document.getElementById('btn'), err = document.getElementById('err');

  try{var sp=sessionStorage.getItem('or_pw'); if(sp){ setTimeout(function(){ btn.disabled=true; btn.textContent='복호화 중...'; unlock(sp); },0); }}catch(e){}
  function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}

  f.addEventListener('submit', function(e){
    e.preventDefault();
    err.textContent=''; btn.disabled=true; btn.textContent='복호화 중...';
    setTimeout(function(){ unlock(pw.value); }, 20);
  });

  function unlock(pass){
    if(!window.crypto || !window.crypto.subtle){
      fail('이 브라우저에서는 열람할 수 없습니다. 최신 Chrome/Edge에서 열어 주십시오.'); return;
    }
    var enc = new TextEncoder();
    crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey'])
    .then(function(base){
      return crypto.subtle.deriveKey(
        {name:'PBKDF2', salt:b64(P.s), iterations:P.i, hash:'SHA-256'},
        base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    })
    .then(function(key){
      return crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.v)}, key, b64(P.c));
    })
    .then(function(buf){
      try{sessionStorage.setItem('or_pw',pass);}catch(e){} render(new TextDecoder().decode(buf));
    })
    .catch(function(){ fail('암호가 올바르지 않습니다.'); });
  }


  // 복호화된 문서를 렌더링한다.
  // document.write()는 Chrome이 외부 스크립트(CDN)를 차단하므로 사용하지 않는다.
  // 1순위: blob URL 최상위 이동 / 2순위: 전체화면 iframe(srcdoc)
  function render(html){
    var done = false;
    try{
      var url = URL.createObjectURL(new Blob([html], {type:'text/html'}));
      var probe = document.createElement('a'); probe.href = url;
      if (false){
        location.replace(url); done = true;
      }
    }catch(e){}
    if (done) return;
    document.title = P.t || document.title;
    var fr = document.createElement('iframe');
    fr.setAttribute('title', document.title);
    fr.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;margin:0;padding:0;background:#fff;z-index:2147483647';
    fr.srcdoc = html;
    document.body.innerHTML = '';
    document.body.style.cssText = 'margin:0;padding:0;background:#fff;display:block';
    document.documentElement.style.cssText = 'margin:0;padding:0';
    document.body.appendChild(fr);
  }

  function fail(m){ try{sessionStorage.removeItem('or_pw');}catch(e){}
    err.textContent = m; btn.disabled=false; btn.textContent='열람하기';
    pw.value=''; pw.focus();
  }
})();
</script>
